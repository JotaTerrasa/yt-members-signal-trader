name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 24
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar sintaxis
        run: npm run lint

      - name: Ejecutar pruebas
        run: npm test

  docker:
    name: Imagen y arranque Docker
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validar Docker Compose
        run: docker compose config --quiet

      - name: Construir imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: futures-magician:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Comprobar arranque, healthcheck y persistencia
        run: npm run docker:check -- --image futures-magician:ci --port 15178

  windows-security:
    name: ACL privadas en Windows
    runs-on: windows-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7

      - name: Comprobar sintaxis PowerShell
        shell: powershell
        run: npm run lint:powershell

      - name: Comprobar auditoría y endurecimiento
        shell: powershell
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'futures-magician-security'
          New-Item -ItemType Directory -Path (Join-Path $fixture '.data\nested') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $fixture '.yt-profile\Default') -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $fixture '.data\config.json') -Value '{}'
          Set-Content -LiteralPath (Join-Path $fixture '.data\nested\event.json') -Value '{}'
          Set-Content -LiteralPath (Join-Path $fixture '.yt-profile\Default\Cookies') -Value 'probe'
          Set-Content -LiteralPath (Join-Path $fixture '.env') -Value 'APP_BASIC_USER=probe'

          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\hardenLocalSecrets.ps1 -Mode Check -Root $fixture | Out-Null
          if ($LASTEXITCODE -ne 1) {
            throw "La auditoría inicial debía detectar permisos heredados."
          }

          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\hardenLocalSecrets.ps1 -Mode Apply -Root $fixture | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "No se pudieron aplicar las ACL privadas."
          }

          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\hardenLocalSecrets.ps1 -Mode Check -Root $fixture | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "La auditoría final no confirmó las ACL privadas."
          }

          if ((Get-Content -LiteralPath (Join-Path $fixture '.data\config.json') -Raw).Trim() -ne '{}') {
            throw "El endurecimiento modificó el contenido protegido."
          }
