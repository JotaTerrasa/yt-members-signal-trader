name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 24
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar sintaxis
        run: npm run lint

      - name: Ejecutar pruebas
        run: npm test

  docker:
    name: Imagen y arranque Docker
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validar Docker Compose
        run: docker compose config --quiet

      - name: Construir imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: futures-magician:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Comprobar arranque, healthcheck y persistencia
        run: npm run docker:check -- --image futures-magician:ci --port 15178
